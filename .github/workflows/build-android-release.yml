name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install required SDK components
        run: |
          yes | sdkmanager "platforms;android-37"
          yes | sdkmanager "build-tools;37.0.0" || echo "skip build-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:android:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppMarket-release
          path: app/android/build/outputs/apk/release/*.apk
          if-no-files-found: error
